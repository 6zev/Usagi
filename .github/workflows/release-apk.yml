name: Build signed release APK

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Release tag to create or update
                required: true
                type: string
            prerelease:
                description: Mark release as prerelease
                required: false
                default: false
                type: boolean
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-release:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        env:
            KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
            KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
            KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        steps:
            -   name: Checkout repository
                uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v6.0.2
                with:
                    submodules: recursive

            -   name: Set up JDK
                uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v5.2.0
                with:
                    distribution: temurin
                    java-version: '17'

            -   name: Set up Android SDK
                uses: android-actions/setup-android@v4

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
                with:
                    gradle-version: '9.1.0'

            -   name: Decode release keystore
                env:
                    ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                run: |
                    test -n "$ANDROID_KEYSTORE_BASE64"
                    echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

            -   name: Build signed release APK
                run: |
                    chmod +x gradlew
                    ./gradlew assembleRelease --no-daemon --stacktrace \
                      -PreleaseStoreFile="$KEYSTORE_FILE" \
                      -PreleaseStorePassword="$KEYSTORE_PASSWORD" \
                      -PreleaseKeyAlias="$KEY_ALIAS" \
                      -PreleaseKeyPassword="$KEY_PASSWORD"

            -   name: Prepare APK asset
                id: apk
                run: |
                    apk_path=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
                    test -n "$apk_path"
                    asset_name="Usagi-${{ github.ref_name }}-release.apk"
                    cp "$apk_path" "$asset_name"
                    echo "path=$asset_name" >> "$GITHUB_OUTPUT"

            -   name: Publish GitHub release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ inputs.tag || github.ref_name }}
                    prerelease: ${{ inputs.prerelease || false }}
                    generate_release_notes: true
                    files: ${{ steps.apk.outputs.path }}
